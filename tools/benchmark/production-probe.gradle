allprojects {
    afterEvaluate {
        tasks.register('productionProbeHierarchyJar', Jar) {
            from(sourceSets.main.output)
            archiveFileName = 'production-probe-hierarchy.jar'
            destinationDirectory = rootProject.file('build/navigation-verification')
        }
        tasks.register('productionProbeJar', Jar) {
            from(sourceSets.test.output) {
                include 'an/**', 'META-INF/mods.toml', 'an_performance.mixins.json'
            }
            manifest { attributes('MixinConfigs': 'an_performance.mixins.json') }
            archiveFileName = 'production-probe.jar'
            destinationDirectory = rootProject.file('build/navigation-verification')
        }
        tasks.register('coldTopologyProbeJar', Jar) {
            from(sourceSets.test.output) {
                include 'an/**', 'META-INF/mods.toml', 'an_cold.mixins.json'
            }
            manifest { attributes('MixinConfigs': 'an_cold.mixins.json') }
            archiveFileName = 'cold-topology-probe.jar'
            destinationDirectory = rootProject.file('build/navigation-verification')
        }
        reobf { productionProbeJar {}; coldTopologyProbeJar {} }
        tasks.named('reobfProductionProbeJar').configure {
            libraries.from(tasks.named('productionProbeHierarchyJar').flatMap { it.archiveFile })
            dependsOn tasks.named('productionProbeHierarchyJar')
        }
        tasks.named('reobfColdTopologyProbeJar').configure {
            libraries.from(tasks.named('productionProbeHierarchyJar').flatMap { it.archiveFile })
            dependsOn tasks.named('productionProbeHierarchyJar')
        }
    }
}
