plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

def acceleratedNavigationMod = [
        id         : 'accelerated_navigation',
        name       : 'Accelerated Navigation',
        license    : 'AGPLv3',
        version    : '0.1.0',
        group      : 'com.scarasol.acceleratednavigation',
        authors    : 'Scarasol',
        description: 'Server-side hierarchical navigation scheduling infrastructure.'
]

version = acceleratedNavigationMod.version
group = acceleratedNavigationMod.group

base {
    archivesName = acceleratedNavigationMod.id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Keep test fixtures available to GameTest without packaging them in the mod jar.
sourceSets {
    main {
        java.exclude 'com/scarasol/acceleratednavigation/gametest/**'
    }
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.gameTest.output
        runtimeClasspath += sourceSets.gameTest.output
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            jvmArgs = [
                    '-XX:+IgnoreUnrecognizedVMOptions',
                    '-XX:+AllowEnhancedClassRedefinition',
                    '-XX:HotswapAgent=fatjar'
            ]
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${acceleratedNavigationMod.id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', acceleratedNavigationMod.id
        }

        server {
            property 'forge.enabledGameTestNamespaces', acceleratedNavigationMod.id
            args '--nogui'
        }

        terrainBenchmarkServer {
            parent minecraft.runs.server
            taskName 'runTerrainBenchmarkServer'
            workingDirectory project.file('run-terrain-benchmark-current')
            args '--mixin.config', 'accelerated_navigation.terrain_benchmark.mixins.json'
            property 'acceleratedNavigation.terrainBenchmark', 'true'
            property 'acceleratedNavigation.terrainReport',
                    layout.buildDirectory.file(
                            'reports/real-terrain-topology-0805-current.json'
                    ).get().asFile.absolutePath
            mods {
                "${acceleratedNavigationMod.id}" {
                    source sourceSets.gameTest
                }
            }
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', "${acceleratedNavigationMod.id},minecraft"
            mods {
                "${acceleratedNavigationMod.id}" {
                    source sourceSets.gameTest
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', acceleratedNavigationMod.id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.3.6'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.3.6')) {
        jarJar.ranged(it, '[0.3.6,)')
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

mixin {
    add sourceSets.main, 'accelerated_navigation.refmap.json'
    config 'accelerated_navigation.mixins.json'
    debug.export = true
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : acceleratedNavigationMod.id,
            mod_name               : acceleratedNavigationMod.name,
            mod_license            : acceleratedNavigationMod.license,
            mod_version            : acceleratedNavigationMod.version,
            mod_authors            : acceleratedNavigationMod.authors,
            mod_description        : acceleratedNavigationMod.description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/scarasol/acceleratednavigation/gametest/**'

    manifest {
        attributes([
                'Specification-Title'     : acceleratedNavigationMod.id,
                'Specification-Vendor'    : acceleratedNavigationMod.authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : acceleratedNavigationMod.authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('verifyGameTestSourceSetIsolation') {
    doLast {
        def leaked = sourceSets.main.allJava.files.findAll {
            it.toPath().toString().replace('\\', '/').contains(
                    '/com/scarasol/acceleratednavigation/gametest/'
            )
        }
        if (!leaked.isEmpty()) {
            throw new GradleException("GameTest sources leaked into main: ${leaked}")
        }
    }
}

tasks.register('prepareTerrainBenchmarkServer') {
    def runDirectory = layout.projectDirectory.dir('run-terrain-benchmark-current')
    def eulaFile = runDirectory.file('eula.txt')
    def propertiesFile = runDirectory.file('server.properties')
    def reportFile = layout.buildDirectory.file(
            'reports/real-terrain-topology-0805-current.json'
    )
    def worldDirectory = runDirectory.dir('terrain-benchmark-world-0805-20260820-a')
    outputs.files(eulaFile, propertiesFile)
    outputs.upToDateWhen { false }
    doLast {
        if (worldDirectory.asFile.exists()) {
            throw new GradleException(
                    "Current-source terrain benchmark world already exists: ${worldDirectory.asFile}"
            )
        }
        reportFile.get().asFile.delete()
        runDirectory.asFile.mkdirs()
        eulaFile.asFile.setText('eula=true\n', 'UTF-8')
        propertiesFile.asFile.setText('''\
allow-flight=true
difficulty=normal
enable-command-block=false
enable-rcon=false
enable-status=false
generate-structures=true
level-name=terrain-benchmark-world-0805-20260820-a
level-seed=73939133
level-type=minecraft:normal
max-tick-time=-1
motd=Accelerated Navigation Current Terrain Benchmark
online-mode=false
server-ip=127.0.0.1
server-port=0
simulation-distance=4
spawn-protection=0
sync-chunk-writes=true
view-distance=4
''', 'UTF-8')
    }
}

tasks.register('verifyTerrainBenchmarkReport') {
    doLast {
        def report = layout.buildDirectory.file(
                'reports/real-terrain-topology-0805-current.json'
        ).get().asFile
        if (!report.isFile()) {
            throw new GradleException('Current-source real terrain benchmark did not produce a report')
        }
        def parsed = new groovy.json.JsonSlurper().parse(report)
        if (parsed.benchmarkKind != 'real_generated_terrain_current_0805') {
            throw new GradleException('Current-source real terrain report has the wrong kind')
        }
        def names = parsed.routes.collect { it.name } as Set
        def expected = [
                'surface_8', 'surface_64', 'surface_96', 'surface_512',
                'cave_8', 'cave_64', 'cave_96',
                'nether_8', 'nether_64', 'nether_96'
        ] as Set
        if (names != expected) {
            throw new GradleException("Current-source report route mismatch: ${expected - names}")
        }
    }
}

tasks.matching { it.name == 'runTerrainBenchmarkServer' }.configureEach {
    dependsOn tasks.named('prepareTerrainBenchmarkServer')
    finalizedBy tasks.named('verifyTerrainBenchmarkReport')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyGameTestSourceSetIsolation')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
